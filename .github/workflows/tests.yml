name: Tests and notebooks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - python: '3.9'
            cirq: '1.3.0'
          - python: '3.13'
            cirq: '1.6.1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[test,notebooks]' 'cirq-core==${{ matrix.cirq }}'
      - run: python -m pytest --cov=cirq_sic --cov-report=term-missing
      - run: python tools/execute_notebooks.py
      - run: python -m build
